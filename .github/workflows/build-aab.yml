name: Build LoMo AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Unzip and Build
        run: |
          unzip -o lomo-twa-android-source.zip -d .
          echo "n" | bubblewrap build --skipPwaValidation
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lomo-aab
          path: app-release-bundle.aab
